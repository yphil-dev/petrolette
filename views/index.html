<!doctype html>
<html lang="en">
  <head>

    <title>Pétrolette</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:title" content="Pétrolette">
    <meta property="og:description" content="The fly-by-night news reader">
    <meta name="description" content="The fly-by-night news reader" />
    <meta property="og:image" content="http://takeoff.petrolette.space/img/screenshot-desktop.png">
    <meta property="og:url" content="http://petrolette.space">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/favicons/favicon-16x16.png">
    <link rel="manifest" href="/static/images/favicons/site.webmanifest">
    <link rel="mask-icon" href="/static/images/favicons/safari-pinned-tab.svg" color="#5bbad5">
    <link rel="shortcut icon" href="/static/images/favicons/favicon.ico">
    <meta name="msapplication-TileColor" content="#2d89ef">
    <meta name="msapplication-config" content="/static/images/favicons/browserconfig.xml">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="/static/css/themes/base/jquery-ui.min.css">
    <link id="theme" rel="stylesheet" href="/static/css/themes/night.css">
    <link rel="stylesheet" href="/static/css/fontello.css">
    <link rel="stylesheet" href="/bower/fancybox/dist/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="/bower/intro.js/minified/introjs.min.css" />

    <link rel="stylesheet" href="/static/css/petrolette.css">

    <script src="/bower/jquery/dist/jquery.min.js"></script>
    <script src="/bower/jquery-ui/jquery-ui.min.js"></script>
    <script src="/bower/intro.js/minified/intro.min.js"></script>
    <script src="/bower/fancybox/dist/jquery.fancybox.min.js"></script>
    <script src="/bower/remotestorage/release/remotestorage.js"></script>
    <script src="/bower/rs-widget/build/widget.js"></script>

    <script src="/static/js/PTL.main.js"></script>
    <script src="/static/js/PTL.prefs.js"></script>
    <script src="/static/js/PTL.i18n.js"></script>

  </head>

  <body>

    <div id="overlay" class="hidden"></div>

    <div id="preload">
      <i class="fontello"></i>
      <i class="logo-title">.</i>
      <i class="feed-title">.</i>
      <i class="ui-icon"></i>
    </div>

    <nav id="top-menu" class="menu">
      <div class="topnav" id="topnav">

        <div id="menuButton"
             class="menuBarItem logoType translate js-enabled-only"
             title="Set Pétrolette preferences/options"
             data-title="Set Pétrolette preferences/options">
          <i class="logoType icon-menu"></i>
          <span class="text translate"
                data-content="Menu">
            Menu
          </span>
        </div>

        <div class="menuBarItem logoType translate help-button js-enabled-only"
             title="Documentation"
             data-title="Documentation">
          <i class="logoType icon-help"></i>
          <span class="text translate"
                data-content="Help">
            Help
          </span>
        </div>

        <div id="newFeedButton"
             class="menuBarItem logoType translate new-feed-button js-enabled-only"
             title="Add a feed"
             data-title="Add a feed">
          <i class="logoType icon-plus"></i>
          <span class="text translate"
                data-content="Feed">
            Feed
          </span>
        </div>

        <div id="logo-title" title="Pétrolette <%= version %>">
          <div class="logo-title">
            <a href="http://takeoff.petrolette.space">Pétrolette</a>
          </div>
          <div class="logoType">
            <i class="icon-petrolette"></i>
          </div>
        </div>

      </div>
    </nav>

    <nav id="sideMenu" class="menu">
      <div id="sideMenu" class="plip">

        <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="languageLegend"
                  class="ui-corner-top translate"
                  data-content="Language">
            Language
          </legend>
          <select id="language"
                  class="unique translate"
                  name="language"
                  data-title="Language"
                  title="Language">
            <option id="optionEnglish"
                    class="translate"
                    data-content="English"
                    selected="selected"
                    value="en"></option>
            <option id="optionFrench"
                    class="translate"
                    data-content="Français"
                    value="fr"></option>
            <option id="optionJapanese"
                    class="translate"
                    data-content="日本語"
                    value="ja"></option>
            <option id="optionSpanish"
                    class="translate"
                    data-content="Español"
                    value="es"></option>
          </select>
        </fieldset>

        <fieldset class="ui-widget ui-widget-content ui-corner-all">
          <legend id="tabsLegend"
                  class="ui-corner-top translate"
                  data-content="Feeds">
            Feeds
          </legend>
          <div class="flex-box">
            <input id="fileImport"
                   type="file"
                   style="display: none;" />
            <button id="fileImport"
                    class="grow translate"
                    data-title="Open / import groups and feeds"
                    data-content="Open">
              <i class="icon-upload"></i>
              Open
            </button>
            <button id="saveTabs"
                    class="grow translate last"
                    data-title="Save / export groups and feeds"
                    data-content="Save">
              <i class="icon-download"></i>
              Save
            </button>
          </div>
          <div id="sync-box"></div>
          <div id="progress-bar"><div class="progress-label"></div></div>
        </fieldset>

        <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="themeLegend"
                  class="ui-corner-top translate"
                  data-content="Theme">
            Theme
          </legend>
          <div id="themeBox"
               class="flex-box">
            <label id="dayLabel"
                   class="grow translate"
                   for="day"
                   data-title="Day theme"
                   title="Day theme"
                   data-content="Day">
              Day
            </label>
            <input id="day"
                   class="themeSwitcher checkboxradio"
                   type="radio"
                   name="radio-1"
                   value="day">
            <label id="nightLabel"
                   class="grow translate last"
                   for="night"
                   data-title="Night theme"
                   title="Night theme"
                   data-content="Night">
              Night
            </label>
            <input id="night"
                   class="themeSwitcher checkboxradio noBottom"
                   type="radio"
                   name="radio-1"
                   value="night">
          </div>
        </fieldset>

        <fieldset id="galleryBox"
                  class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="imageGalleryLegend"
                  class="ui-corner-top translate"
                  data-content="Image gallery">
            Image gallery
          </legend>
          <label class="ui-helper-hidden"
                 for="gallerySlideshowSpeedValue"></label>
          <span id="gallerySlideshowSpeedValue"
                class="twin"></span>
          <div id="gallerySlideshowSpeed"></div>
          <div class="flex-box">
            <div class="grow">
              <label for="gallerySpeed" class="ui-helper-hidden">
                <input type="text" id=""gallerySpeed" />
              </label>
              <div id="gallerySpeedSlider"
                   data-title="Slideshow speed"
                   class="translate">
              </div>
            </div>
            <label for="spinner" class="ui-helper-hidden">Select a value:</label>
            <input id="gallerySpeedSpinner"
                   data-title="Slideshow speed"
                   class="translate"
                   name="value">
            <select id="gallerySlideTransition"
                    class="unique translate"
                    data-title="Slide transition">
              <option class="translate"
                      data-content="None"
                      value="false">None</option>
              <option class="translate"
                      data-content="Fade"
                      value="fade">Fade</option>
              <option class="translate"
                      data-content="Slide"
                      value="slide">Slide</option>
              <option class="translate"
                      data-content="Circular"
                      value="circular">Circular</option>
              <option class="translate"
                      data-content="Tube"
                      value="tube">Tube</option>
              <option class="translate"
                      data-content="Zoom"
                      value="zoom-in-out">Zoom-in-out</option>
              <option class="translate"
                      data-content="Rotate"
                      value="rotate">Rotate</option>
            </select>
          </div>
        </fieldset>

        <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="helpLegend"
                  data-content="Help"
                  class="ui-corner-top translate">
            Help
          </legend>

          <div class="flex-box">
            <a href="https://framagit.org/yphil/petrolette"
               class="ui-button ui-widget ui-corner-all unique translate"
               data-title="Use the force - read the Source"
               title="Use the force - read the Source"
               data-content="Source code">
              Source code
            </a>
            <button id="help"
                    class="grow translate help-button"
                    data-title="Documentation"
                    data-content="Help"
                    title="Documentation">
              Help
            </button>
            <a href="https://liberapay.com/yPhil/donate"
               class="ui-button ui-widget ui-corner-all translate last"
               data-title="Send your love to Pétrolette"
               title="Send your love to Pétrolette"
               data-content="Donate">
              Donate
            </a>
            <a href="/about/javascript"
               data-jslicense="1"
               class="ui-button ui-widget ui-corner-all unique translate"
               data-title="JavaScript license information"
               title="JavaScript license information"
               data-content="JS Licences">
              JS Licence info
            </a>
          </div>

        </fieldset>

        <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="languageLegend"
                  class="ui-corner-top translate"
                  data-content="Search URL string">
            Search URL string
          </legend>
          <div class="flex-box">
            <!-- <input type="text" id="searchPrefix" class="grow" /> -->
            <input name="searchPrefix"
                   id="searchPrefixInput"
                   class="unique ui-widget-content ui-corner-all translate"
                   placeholder="plop"
                   data-title="plip"
                   value=""
                   title="zz"
            />

            <button id="searchPrefixOkButton"
                    data-title="OK"
                    class="translate ui-button ui-corner-all ui-widget"
                    type="button"
                    title="OK">
              Ok
            </button>

            <button id="searchPrefixRestoreButton"
                    data-title="Restore default"
                    class="last grow translate ui-button ui-corner-all ui-widget"
                    type="button"
                    title="Restore default">
              Restore default
            </button>

          </div>
        </fieldset>

        <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
          <legend id="languageLegend"
                  class="ui-corner-top translate"
                  data-content="Console">
            Console
          </legend>
          <div
            class="unique"
            data-title="Click to toggle"
            title="Click to toggle"
            id="console"></div>
        </fieldset>

      </div>
    </nav>

    <main>

      <div id="tabs">
        <ul id="tab-names">

        </ul>
      </div>


      <noscript>
        <div id="no-script">
          <h1>Uh-oh</h1>
          <h3>Pétrolette cannot work without javascript.</h3>
          <ul>
            <li>
              <a href="/about/javascript" data-jslicense="1">JavaScript license information</a>
            </li>
            <li>
              Use the force, read <a href="https://framagit.org/yphil/petrolette">the source</a>.
            </li>
          </ul>
        </div>
      </noscript>

      <div id="dialogs"></div>

      <span id="backtop">
        <i class="icon-up"></i>
      </span>

      <div id="load-spinner"
           class="dead-center hidden">
        <div>
          <i class="icon-refresh spin"></i>
          <div>Loading feeds</div>
        </div>
      </div>

    </main>

    <script src="/static/js/PTL.util.js"></script>
    <script src="/static/js/PTL.tab.js"></script>
    <script src="/static/js/PTL.col.js"></script>
    <script src="/static/js/PTL.feed.js"></script>
    <script src="/static/js/PTL.dialog.js"></script>
    <script src="/static/js/PTL.sync.js"></script>

    <script>

     $(document).ready(function() {
       PTL.start();

       PTL.queryString = '<%= queryString %>';

       PTL.tab.init();

     });

    </script>
  </body>
</html>
