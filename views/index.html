<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Petrolette</title>

    <link rel="icon" type="image/png" href="/static/images/petrolette.png" />

    <link rel="preload" as="font" href="public/font/fontello.eot">
    <link rel="preload" as="font" href="public/font/fontello.svg">
    <link rel="preload" as="font" href="public/font/fontello.ttf">
    <link rel="preload" as="font" href="public/font/fontello.woff">
    <link rel="preload" as="font" href="public/font/fontello.woff2">

    <link rel="preload" as="style" href="/static/css/themes/mob-ui.css">
    <link rel="preload" as="style" href="/static/css/themes/day/jquery-ui.css">
    <link rel="preload" as="style" href="/static/css/fontello.css">
    <link rel="preload" as="style" href="/static/css/petrolette.css">
    <link rel="preload" as="style" href="/static/css/themes/day.css">
    <link rel="preload" as="style" href="/static/css/themes/night.css">

    <link rel="stylesheet" href="/static/css/themes/day/jquery-ui.min.css">

    <link rel="stylesheet" href="/static/css/fontello.css" media="none" onload="this.media='all';">

    <link rel="stylesheet" id="mobStyle" href="/static/css/themes/day.css">

    <link rel="stylesheet" href="/static/css/circle.css">

    <link rel="stylesheet" href="/static/css/mob-ui.css" media="none" onload="this.media='all';">
    <link rel="stylesheet" href="/static/css/petrolette.css" media="none" onload="this.media='all';">

    <!-- <link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/grobe-deutschmeister" type="text/css"/> -->
    <link rel="stylesheet" href="/bower/fancybox/dist/jquery.fancybox.min.css" />
    <link rel="stylesheet" href="/bower/intro.js/minified/introjs.min.css" />
    <!-- <link href="/bower/intro.js/themes/introjs-nassim.css" rel="stylesheet">
    -->
    <script src="/bower/jquery/dist/jquery.min.js"></script>
    <script src="/bower/jquery-ui/jquery-ui.min.js"></script>

    <script src="/bower/intro.js/minified/intro.min.js"></script>
    <script src="/bower/notifyjs/dist/notify.js"></script>

    <script src="/bower/fancybox/dist/jquery.fancybox.min.js"></script>

    <script src="/static/lib/js/main.js"></script>
    <script src="/static/lib/js/prefs.js"></script>
    <script src="/static/lib/js/i18n.js"></script>

    <script>

     document.fonts.ready.then((fontFaceSet) => {
       console.log(fontFaceSet.name, 'FontFace loaded.');
       console.log(fontFaceSet.size, 'FontFaces loaded.');
       // document.getElementById('waitScreen').style.display = 'none';
       // document.getElementById('loadRadial').style.right = '10px';
     });

     console.log('Lang: %s (prefs: %s)', navigator.language, MOB.prefs.readConfig('lang'))

     MOB.language = MOB.prefs.readConfig('lang');

     $(document).ready(function() {

       $( document ).keydown(function( event ) {
         if ( event.keyCode === $.ui.keyCode.ESCAPE ) {
           $( ".tabSort" ).sortable( "cancel" );
         }
       });

       $("#mobStyle").attr({href : '/static/css/themes/' + MOB.prefs.readConfig('theme') + '.css'});

       var $tabs = $('#tabs').tabs({
         heightStyle: 'content',
         activate: function(event, ui) {

           var $activeTab = $tabs.find('.ui-tabs-active');

           $(document).prop('title', $activeTab.text() + ' | Petrolette');

           $('.tabCloser').hide();

           $activeTab.find('.tabCloser').show();
         }

       });

       $tabs.find('.ui-tabs-nav').sortable({
         axis: 'x',
         items: '> li:not(#newTabButton)',
         stop: function() {
           $tabs.tabs('refresh');
           MOB.tab.saveTabs();
         }
       });

       $tabs.on('mouseup', '.ui-tabs-active a', function(e){
         e.preventDefault();
         if (e.which === 1) {
           MOB.dialog.renameGroup($(this))
         }
       });

       $tabs.on("click", "i.tabCloser", function() {
         MOB.dialog.killTab($(this));
       });

       $('#nothingButton button').click(function() {
         MOB.dialog.newContent();
       });

       // INIT

       if (MOB.utilities.isMobile()) {
         console.log()
         $tabs.find('.prefs').css('display', 'initial');
       }

       console.log('TABS: (%s)', $.parseJSON(MOB.prefs.readConfig('tabs')).length)

       MOB.tab.makeNewTabButton($tabs);

       if ($.parseJSON(MOB.prefs.readConfig('tabs')).length > 0) {
         MOB.tab.populate(JSON.parse(MOB.prefs.readConfig('tabs')));
       } else {
         console.error('Zero tabs!');
         $('#nothingButton').fadeIn('slow');
       }
       // $tabs.find('div.feedControls').slideUp();

     });

    </script>

    <style>

     div#preloaded-images {
         position: absolute;
         overflow: hidden;
         left: -9999px;
         top: -9999px;
         height: 1px;
         width: 1px;
     }

    </style>

  </head>

  <body>


    <div id="tabs">
      <ul id="tabUl"></ul>
    </div>

    <div id="mobDialogs"></div>

    <script src="/static/lib/js/tab.js"></script>
    <script src="/static/lib/js/feed.js"></script>
    <script src="/static/lib/js/dialog.js"></script>
    <script src="/static/lib/js/utilities.js"></script>
    <script src="/static/lib/js/menu.js"></script>

    <div id="loadRadial" class="c100 small p0 hidden" style="display:none;">
      <span>0%</span>
      <div class="slice">
        <div class="bar"></div>
        <div class="fill"></div>
      </div>
    </div>

    <div id="nothingButton" class="deadCenter hidden" style="display:none;">
      <button>
        Whoops, no content! <br/>
        Click here to add some.
      </button>
    </div>

    <div id="preloaded-images">
      <img src="/static/images/feed-toggle-triangle-fff.png" width="1" height="1" alt="Image 01" />
      <img src="/static/images/feed-toggle-triangle-000.png" width="1" height="1" alt="Image 02" />
      <img src="/static/images/icon-flamable.png" width="1" height="1" alt="Image 03" />
    </div>

  </body>
</html>
