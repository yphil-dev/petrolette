<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mobylette</title>
        <link rel="shortcut icon" type="image/png" href="/static/images/favicon.png" />
        <link id="stylesheet" rel="stylesheet" href="/static/css/themes/light/jquery-ui.css">
        <link rel="stylesheet" href="/static/css/fontello.css">

        <!-- <script src="https://code.jquery.com/jquery-1.12.4.js"></script> -->
        <!-- <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script> -->

        <script src="/bower/jquery/dist/jquery.js"></script>
        <script src="/bower/jquery-ui/jquery-ui.js"></script>

        <script src="/bower/slidereveal/dist/jquery.slidereveal.js"></script>

        <link rel="stylesheet" href="/bower/fancybox/dist/jquery.fancybox.min.css" />
        <script src="/bower/fancybox/dist/jquery.fancybox.min.js"></script>
        <!-- <script src="/bower/mustache.js/mustache.js"></script>
        -->

        <link rel="stylesheet" href="/static/css/mobylette.css">

        </script>

        <script>

         $(document).ready(function() {

             var $tabs = $("#tabs").tabs({

                 activate: function(event, ui){
                     var $activeTabLink = $('a[href="#tab-' + (ui.newTab.index() + 1) + '"]');
                     $('.ui-tabs-tab i').remove()
                     var $activeTab = $activeTabLink.parent()
                     $activeTab.append('<i class="icon-cancel-circled tabCloser"></i>')
                 }

             });

             var gallerySlideshowSpeed = Prefs.readConfig('gallerySlideshowSpeed');
             var gallerySlideTransition = Prefs.readConfig('gallerySlideTransition');

             $.fancybox.defaults.transitionEffect = gallerySlideTransition
             $.fancybox.defaults.slideShow = {
                 autoStart : false,
                 speed     : gallerySlideshowSpeed
             }

             var $handle = $('.mobylette > .handle')
             var $slider = $('#slider')
             // $handle.hide();

             $slider.slideReveal({
                 width: 275
             });

             $handle.click(function () {
                 $slider.slideReveal("toggle", false);
                 $(this).children('i').toggleClass('other')
             });

             var $tabUl = $('#tabUl');

             $tabUl.hover(
                 function(e) {

                     if (e.relatedTarget && e.relatedTarget.nodeName === 'BUTTON')
                         return false
                     else
                         $('#addTab, .addFeed').fadeIn('fast')

                 },
                 function(e) {

                     if (e.relatedTarget && e.relatedTarget.nodeName === 'BUTTON')
                         return false;
                     else
                         $('#addTab, .addFeed').fadeOut('slow');
                 }
             );

             var tabList = Prefs.readConfig('tabs');

             $tabs.on( "click", ".mobFeedRefresh", function() {
                 Feed.populateFeed($(this));
             });

             // var stringed = JSON.stringify(tabList);
             var parsed = JSON.parse(tabList);

             parsed.forEach(function(tab) {
                 Tab.newTab($tabs, tab.name, tab.feeds);
             });

             $('#addTab').click(function () {
                 Tab.newTab($tabs);
             });

             $('#loadTabs').click(function () {
                 Tab.populateTabs($tabUl, parsed, $tabs);
                 $('#tabs').find('.mobFeedRefresh').click();
             });

             $('#saveTabs').click(function () {
                 var allTabs = Tab.getTabs()
                 Prefs.writeConfig('tabs', JSON.stringify(allTabs));
                 // console.log('tabs: ' + JSON.stringify(allTabs))
             });

             $tabs.find('.ui-tabs-nav').sortable({
                 axis: 'x',
                 stop: function() {
                     $tabs.tabs('refresh');
                     Tab.saveTabs()
                 }
             });

             $('button').button();
             $('#files').button();

             $( 'input[type=radio]' ).checkboxradio();
             $('#tabDropActivate').checkboxradio();

             $('#feedLimit').spinner({
                 spin: function( event, ui ) {
                     if ( ui.value > 64 ) {
                         $( this ).spinner( "value", 0 );
                         return false;
                     } else if ( ui.value < 0 ) {
                         $( this ).spinner( "value", 64 );
                         return false;
                     }
                 }
             });

             $tabs.on('mouseup', '.ui-tabs-active a', function(e){
                 e.preventDefault();

                 if (e.which === 1) {

                     $('#tabDialog')
                         .data('tabName', $(this).text())
                         .data('tabId', $(this).attr('id'))
                         .dialog('open');
                     return;
                 }

             });

             // Close icon: removing the tab on click
             $tabs.on("click", "i.tabCloser", function() {

                 var $a = $(this).prev('a.ui-tabs-anchor')

                 $('#killTabDialog').data('tabName', $a.text())
                                 .data('panelId', $a.attr('href'))
                                 .data('tabLinkId', $a.prop('id'))
                                 .dialog('open')
                 $('#killTabDialog').dialog('option', 'title', 'Kill the ' + $a.text() + ' tab?');
             });

             console.log('---- INDEX OK ----');

             // Prefs
             $('#themes').selectmenu({
                 width: 252,
                 change: function( event, data ) {

                     Prefs.writeConfig('theme', data.item.value);

                     $("#stylesheet").attr({href : 'https://code.jquery.com/ui/1.12.1/themes/' + Prefs.readConfig('theme') + '/jquery-ui.css'});

                 }
             });

             $('#gallerySlideTransition').selectmenu({
                 width: 252,
                 change: function( event, data ) {

                     console.log('Value: ' + data.item.value)
                     $.fancybox.defaults.transitionEffect = data.item.value
                     Prefs.writeConfig('gallerySlideTransition', data.item.value);

                     // Prefs.writeConfig('gallerySlideTransition', data.item.value);

                     // $("#stylesheet").attr({href : 'https://code.jquery.com/ui/1.12.1/themes/' + Prefs.readConfig('theme') + '/jquery-ui.css'});

                 }
             });

             $('#gallerySlideTransition').val(gallerySlideTransition).selectmenu("refresh");

             // $("#stylesheet").attr({href : 'https://code.jquery.com/ui/1.12.1/themes/' + Prefs.readConfig('theme') + '/jquery-ui.css'});

             if (Prefs.readConfig('tabDropActivate') === 'true')
                 $('#tabDropActivate').prop('checked', true).checkboxradio('refresh')
             else
                 $('#tabDropActivate').prop('checked', false).checkboxradio('refresh')

             $('#tabDropActivate').change(function() {
                 Prefs.writeConfig('tabDropActivate', $(this).prop('checked'));
             });

             $('#sslider').slider({
                 value: gallerySlideshowSpeed,
                 min: 0,
                 max: 10000,
                 step: 100,
                 slide: function( event, ui ) {
                     $('#amount').val(ui.value + 'ms');
                 },
                 change: function( event, ui ) {
                     Prefs.writeConfig('gallerySlideshowSpeed', ui.value);
                     $.fancybox.defaults.slideShow = {
                         speed     : ui.value
                     }

                 }
             });
             $('#amount').val($('#sslider').slider('value') + 'ms');

             $('#tabs').find('.mobFeedRefresh').click();

             $('#tabs').find('div.feedControls').slideUp()


             $('.mobDOM').fadeIn('slow')
             $('#addTab').fadeOut(2000);
             $('.addFeed').fadeOut(2000);

             var tdata = {
                 title: "Constructing HTML Elements"
             }

             //
             //              $.get("/static/templates/dialog-renameTab.mst", function(template) {
             //                  var rendered = Mustache.render(template, tdata);
             //                  var $rendered = $(rendered)
             //                  $("body").append(rendered);
             //              });
             //


             // var $jsonUpload = $('#jsonUpload').button()
             //
             //              $jsonUpload.change(function(){
             //                  // console.log(this.value || 'Nothing selected')
             //              });
             //
             //

             // $('#jsonUpload').fileUpload();

             $('#jsonUpload').fileUpload({
                 uploadData    : { 'extra_data' : 'blah' }, // Append POST data to the upload
                 submitData    : { 'moar_extra_data' : 'blah' }, // Append POST data to the form submit
                 uploadOptions : { dataType : 'json' }, // Customise the parameters passed to the $.ajax() call on uploads. You can use any of the normal $.ajax() params
                 submitOptions : { dataType : 'json' }, // Customise the parameters passed to the $.ajax() call on the form submit. You can use any of the normal $.ajax() params
                 before       : function(){
                     console.log('plop!')
                 }, // Run stuff before the upload happens
                 beforeSubmit  : function(uploadData){ console.log(uploadData); return true; }, // access the data returned by the upload return false to stop the submit ajax call
                 success       : function(data, textStatus, jqXHR){ console.log(data); }, // Callback for the submit success ajax call
                 error        : function(jqXHR, textStatus, errorThrown){ console.log(jqXHR); }, // Callback if an error happens with your upload call or the submit call
                 complete      : function(jqXHR, textStatus){ console.log(jqXHR); } // Callback on completion
             });

         });

         function myFunction(){
             var x = document.getElementById("myFile");
             var txt = "";
             if ('files' in x) {
                 if (x.files.length == 0) {
                     txt = "Select one or more files.";
                 } else {
                     for (var i = 0; i < x.files.length; i++) {
                         txt += "<br><strong>" + (i+1) + ". file</strong><br>";
                         var file = x.files[i];
                         if ('name' in file) {
                             txt += "name: " + file.name + "<br>";
                         }
                         if ('size' in file) {
                             txt += "size: " + file.size + " bytes <br>";
                         }
                     }
                 }
             }
             else {
                 if (x.value == "") {
                     txt += "Select one or more files.";
                 } else {
                     txt += "The files property is not supported by your browser!";
                     txt  += "<br>The path of the selected file: " + x.value; // If the browser does not support the files property, it will return the path of the selected file instead.
                 }
             }
             document.getElementById("demo").innerHTML = txt;
         }

        </script>

    </head>

    <body>

        <div id="tabs" class="mobDOM">
            <ul id="tabUl"></ul>
        </div>

        <button id="addTab" class="mobDOM"><i class="icon-plus"></i> Tab</button>

        <i id="savingIcon" class="icon-download"></i>

        <div id="killTabDialog" title="" class="mobDOM">
            <p><span class="ui-icon ui-icon-alert" style="float:left; margin:12px 12px 20px 0;"></span>These items will be permanently deleted and cannot be recovered. Are you sure?</p>
        </div>

        <div id="killFeedDialog" title="" class="mobDOM">
            <p><span class="ui-icon ui-icon-alert" style="float:left; margin:12px 12px 20px 0;"></span>These items will be permanently deleted and cannot be recovered. Are you sure?</p>
        </div>

        <div id="tabDialog" title="Rename tab" class="mobDOM">
            <form>
                <fieldset>
                    <label for="tabName">Name</label>
                    <input type="text" name="name" id="tabName" value="" />
                    <input type="submit" />
                </fieldset>
            </form>
        </div>

        <div id="feedDialog" title="Feed parameters" class="mobDOM">
            <form>
                <fieldset class="mobDialog">
                    <label for="feedUrl">URL</label>
                    <input type="text" name="url" id="feedUrl" value="" class="text ui-widget-content ui-corner-all">
                    <input type="submit" tabindex="-1" style="position:absolute; top:-1000px">
                    <div class="feedType">
                        <label for="mixed">Mixed</label>
                        <input type="radio" name="radio-1" id="mixed">
                        <label for="photo">Photo</label>
                        <input type="radio" name="radio-1" id="photo">
                        <label for="text">Text</label>
                        <input type="radio" name="radio-1" id="text">
                    </div>
                    <label for="feedLimit">Limit # of items</label>
                    <input id="feedLimit" name="feedLimit">
                </fieldset>
            </form>
        </div>

        <div id="slider" class="mobylette ui-state-default mobDOM">
            <div class="handle">
                <i class="icon-right-open ui-state-default rotate"></i>
            </div>
            <h1>
                <i class="icon-motorcycle" aria-hidden="true"></i>
                <span>Mobylette</span>
            </h1>

            <fieldset class="prefsForm ui-widget ui-widget-content">

                <input type="file" id="myFile" size="50" onchange="myFunction()">
                <p id="demo"></p>

                <!-- <progress></progress> -->
                <!--
                     <div class="jsonUpload">
                     <span class="text">Nothing selected</span>
                     <span class="button">Choose a file</span>
                     <input type="file" id="plop" />
                     </div>
                -->
                <legend>Tabs</legend>


                <button id="saveTabs"><i class="icon-download"></i> Save Tabs</button>
                <button id="loadTabs"><i class="icon-upload"></i> Load Tabs</button>

                <label class="tabDropActivate" for="tabDropActivate">Open tab on feed drop</label>
                <input type="checkbox" name="tabDropActivate" id="tabDropActivate">
                <!-- <button id="colorselector2"><i class="fa fa-cube" aria-hidden="true"></i> Color</button>
                -->
                <label for="themes">Theme</label>
                <select id="themes">
                    <option value="base">Base</option>
                    <option value="black-tie">Black-Tie</option>
                    <option value="blitzer">Blitzer</option>
                    <option value="cupertino">Cupertino</option>
                    <option value="dark-hive">Dark-hive</option>
                    <option value="dot-luv">Dot-luv</option>
                    <option value="eggplant">Eggplant</option>
                    <option value="excite-bike">Excite-bike</option>
                    <option value="flick">Flick</option>
                    <option value="hot-sneaks">Hot-sneaks</option>
                    <option value="humanity">Humanity</option>
                    <option value="le-frog">Le-frog</option>
                    <option value="mint-choc">Mint-choc</option>
                    <option value="overcast">Overcast</option>
                    <option value="pepper-grinder">Pepper-grinder</option>
                    <option value="redmond">Redmond</option>
                    <option value="smoothness">Smoothness</option>
                    <option value="south-street">South-street</option>
                    <option value="start">Start</option>
                    <option value="sunny">Sunny</option>
                    <option value="swanky-purse">Swanky-purse</option>
                    <option value="trontastic">Trontastic</option>
                    <option value="ui-darkness">Ui-darkness</option>
                    <option value="ui-lightness">Ui-lightness</option>
                    <option value="vader">Vader</option>
                </select>

            </fieldset>

            <fieldset class="prefsForm ui-widget ui-widget-content">
                <legend>Image gallery</legend>
                <label for="amount">Slideshow speed&nbsp;<input type="text" id="amount" readonly style="border:0; font-weight:bold;">
                </label>
                <div id="sslider"></div>

                <label for="gallerySlideTransition">Slide transition</label>
                <select id="gallerySlideTransition">
                    <option value="false">None</option>
                    <option value="fade">Fade</option>
                    <option value="slide">Slide</option>
                    <option value="circular">Circular</option>
                    <option value="tube">Tube</option>
                    <option value="zoom-in-out">Zoom-in-out</option>
                    <option value="rotate">Rotate</option>

                </select>

            </fieldset>

        </div>

        <script src="/static/lib/js/tab.js"></script>
        <script src="/static/lib/js/feed.js"></script>
        <script src="/static/lib/js/prefs.js"></script>

    </body>
</html>
