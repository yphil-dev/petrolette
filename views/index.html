<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mobylette</title>

        <link rel="preload" href="/static/css/themes/day.css">
        <link rel="preload" href="/static/css/themes/night.css">

        <link rel="shortcut icon" type="image/png" href="/static/images/favicon.png" />


        <script src="/bower/jquery/dist/jquery.js"></script>
        <script src="/bower/jquery-ui/jquery-ui.js"></script>

        <script src="http://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.2/modernizr.js"></script>

        <script src="/bower/slidereveal/dist/jquery.slidereveal.js"></script>

        <script src="/bower/fancybox/dist/jquery.fancybox.min.js"></script>
        <link rel="stylesheet" href="/bower/fancybox/dist/jquery.fancybox.min.css" />

        <link rel="stylesheet" href="/static/css/themes/day/jquery-ui.css">

        <link rel="stylesheet" href="/static/css/mob-ui.css">
        <link rel="stylesheet" href="/static/css/mobylette.css">

        <link rel="stylesheet" id="mobStyle" href="/static/css/themes/day.css">
        <link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/gidole-regular" type="text/css"/>

        <link rel="stylesheet" href="/static/css/fontello.css">

        <script>

         $(document).ready(function() {

             $("#mobStyle").attr({href : '/static/css/themes/' + Prefs.readConfig('theme') + '.css'});

             var $tabs = $('#tabs').tabs({
                 heightStyle: 'content',
                 activate: function(event, ui) {

                     var $activeTab = $tabs.find('.ui-tabs-active');

                     $(document).prop('title', $activeTab.text() + ' | Mobylette');

                     $('.tabCloser').hide();

                     $activeTab.find('.tabCloser').show();
                 }

             });

             // INIT

             Tab.populateTabs(JSON.parse(Prefs.readConfig('tabs')))

             $tabs.find('.ui-tabs-nav').sortable({
                 axis: 'x',
                 items: '> li:not(#newTabButton)',
                 stop: function() {
                     $tabs.tabs('refresh');
                     Tab.saveTabs()
                 }
             });

             $tabs.on('mouseup', '.ui-tabs-active a', function(e){
                 e.preventDefault();
                 if (e.which === 1)
                     Dialog.renameTab($(this))
             });

             $tabs.on("click", "i.tabCloser", function() {
                 Dialog.killTab($(this))
             });

             $tabs.find('div.feedControls').slideUp()

         });

        </script>

    </head>

    <body>

        <div id="tabs">
            <ul id="tabUl"></ul>
        </div>

        <div id="mobDialogs"></div>

        <script src="/static/lib/js/tab.js"></script>
        <script src="/static/lib/js/feed.js"></script>
        <script src="/static/lib/js/prefs.js"></script>
        <script src="/static/lib/js/menu.js"></script>
        <script src="/static/lib/js/dialog.js"></script>
        <script src="/static/lib/js/utilities.js"></script>

    </body>
</html>
