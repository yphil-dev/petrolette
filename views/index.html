<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mobylette</title>
        <!-- <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" /> -->
        <link id="stylesheet" rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="/static/lib/jQuery-ColorPicker/css/colorpicker.css">
        <link rel="stylesheet" href="bower/components-font-awesome/css/font-awesome.min.css">
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        <script src="/static/lib/jQuery-ColorPicker/colorpicker.js"></script>

        <script src="/static/lib/jQuery-ColorPicker/colorpicker.js"></script>

        <script src="/bower/slidereveal/dist/jquery.slidereveal.js"></script>

    </head>

    <style>

     body {
         background-color: #3e3e3e;
     }

     div.mobylette {
         background-color: #3e3e3e;
         border-right: #2e2e2e solid 1px;
         padding:.5em;
     }

     button.mobylette {
         margin-top: .5em;
     }

     .mobylette h1 {
         color: #fc6a10;
     }

     .mobylette h1 span {
         font-size:1.4em;
         color: orange;
         text-shadow: 1px 1px #5e354a;
     }

     fieldset label,
     button {
         margin: 0 .5em .5em 0;
     }

     h1, h2, h3, h4, h5, h6 {
         font-weight: 700;
         font-family: "klavika-web", "Helvetica Neue", Helvetica, Arial, Geneva, sans-serif !important;
     }

     h1 {
         margin: .5em .5em;
     }

     ul {
         list-style-type: none;
         margin:0;
         padding:0;
     }

     .tabSort li,
     .selected {
         cursor:grab;
         margin: 0 5px 5px 5px;
         padding: 5px;
         font-size: 1.2em;
         width: 25%;
     }

     .chbox {
         margin-right:10px;
     }

     .selected,
     .feed {
         width:250px !important;
     }

     .mobHeader {
         display: flex;
         justify-content: space-between;
     }

     .mobHeader div {
         /* white-space:nowrap; */
         /* display:inline-block; */
     }

     .mobHeader .title {
         width:70%;
     }

     .truncate {
         width: 250px;
         white-space: nowrap;
         overflow: hidden;
         text-overflow: ellipsis;
     }

     .selected {
         opacity: 0.5;
     }

     .hidden {
         display:none;
     }

     .ui-tabs-panel {
         padding:.4em .1em !important;
     }

     label { display:block; }
     input.text { margin-bottom:12px; width:95%; padding: .4em; }
     fieldset { padding:0; border:0; margin-top:25px; }

     .small-button {
         font-size: .2em !important;
         margin:0;
         /* display: table-cell; */
         vertical-align: top;
     }

     .headerItem {
         display:inline-block;
     }

     .ui-button {
         text-align: left !important;
     }

    </style>

    <script>

     var tabList =
         [{"name":"plop",
           "feeds":[
               {"url":"http://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml","type":"photo","limit":16},
               {"url":"http://feeds.bbci.co.uk/news/rss.xml?edition=int","type":"photo","limit":16},
               {"url":"http://feeds.reuters.com/reuters/environment","type":"text","limit":16}
           ]},
          {"name":"plip",
           "feeds": [
               {"url":"http://feeds.reuters.com/news/artsculture","type":"text","limit": 12},
               {"url":"http://feeds.reuters.com/reuters/businessNews","type":"mixed","limit": 8}
           ]},
          {"name":"plup",
           "feeds": [
               {"url":"https://www.sciencedaily.com/rss/matter_energy/engineering.xml","type":"text","limit": 12},
               {"url":"https://feeds.feedburner.com/TechCrunch/","type":"mixed","limit": 8},
               {"url":"https://www.reddit.com/r/nsfw/.rss","type":"mixed","limit": 8},
               {"url":"https://www.reddit.com/.rss","type":"mixed","limit": 8}
           ]}
         ];

     $(document).ready(function() {

         $('#slider').slideReveal({
             trigger: $("#trigger")
         });

         $( "#tabs" ).on( "click", ".mobFeedRefresh", function() {

             var feedUrl = $(this).parent().parent().parent().data('url');
             var $feedTitleDiv = $(this).parent().prev();
             $.get("/feed", {
                 "feedurl": feedUrl
             }, function(data, status){
                 // alert("Data: " + JSON.stringify(data.title) + "\nStatus: " + status + '\nTitleDiv:' + $feedTitleDiv.text());
                 $feedTitleDiv.text(data.title);
             });


         });

         var $tabs = $("#tabs").tabs({
             heightStyle: "fill"
         });

         tabList.forEach(function(tab) {
             Tab.newTab($tabs, tab.name, tab.feeds);
         });

         $('#addTab').click(function () {
             Tab.newTab($tabs);
         });

         $('#saveTabs').click(function () {
             var myTabs = [];

             $( '#theTabs li' ).each(function(i) {
                 var myFeeds = [];
                 var myTab = {};

                 myTab["name"] = $(this).children().text();

                 // myTabs
                 $($(this).children().attr('href') + ' ul li').each(function(i) {
                     var myFeed = {};
                     myFeed["url"] = $(this).data('url');
                     myFeed["type"] = $(this).data('type');
                     myFeed["limit"] = $(this).data('limit');
                     myFeeds.push(myFeed);
                 });
                 myTab["feeds"] = myFeeds;
                 myTabs.push(myTab)
             });
             console.log(JSON.stringify(myTabs));
         });

         $tabs.find( ".ui-tabs-nav" ).sortable({
             axis: "x",
             stop: function() {
                 $tabs.tabs( "refresh" );
             }
         });

         $('#tabLimit').spinner();

         $( 'button' ).button();

         $( ".radio" ).checkboxradio();
         $('#tabDropActivate').checkboxradio();

         $( '#tabDialog' ).dialog({
             autoOpen: false,
             resizable: false,
             height: 'auto',
             width: 400,
             modal: true,
             buttons: {
                 Cancel: function() {
                     $( this ).dialog( 'close' );
                 },
                 'OK': function() {
                     $('#' + $(this).data('tabId')).text($('#tabName').val());
                     $( this ).dialog( 'close' );
                 }
             },
             open: function( event, ui ) {
                 $('#tabName').val($(this).data('tabName'));
             }
         });

         $('#tabs').on('mouseup', '.ui-tabs-active', function(e){
             e.preventDefault();
             $( '#tabDialog' )
                 .data('tabName', $(this).text())
                 .data('tabId', $(this).children('a').prop('id'))
                 .dialog('open');
         });

         console.log('---- INDEX OK ----');


         // Prefs
         $('#themes').selectmenu({
             width: 232,
             change: function( event, data ) {

                 Prefs.writeConfig('theme', data.item.value);

                 $("#stylesheet").attr({href : 'https://code.jquery.com/ui/1.12.1/themes/' + Prefs.readConfig('theme') + '/jquery-ui.css'});

             }
         });

         $("#stylesheet").attr({href : 'https://code.jquery.com/ui/1.12.1/themes/' + Prefs.readConfig('theme') + '/jquery-ui.css'});

         // $('body').css('background-color', '#' + Prefs.readConfig('background-color'));

         $('#tabDropActivate').val(Prefs.readConfig('tabDropActivate'));

         $('#tabDropActivate').change(function() {
             Prefs.writeConfig('tabDropActivate', $(this).prop('checked'));
         });

         $('#colorselector2').ColorPicker({
             color: '#EFEFEF',
             onShow: function (colpkr) {
                 $(colpkr).fadeIn(500);
                 return false;
             },
             onHide: function (colpkr) {
                 $(colpkr).fadeOut(500);
                 return false;
             },
             onChange: function (hsb, hex, rgb) {
                 $('#colorSelector div').css('backgroundColor', '#' + hex);
                 Prefs.writeConfig('background-color', hex);

                 $('body').css('background-color', '#' + Prefs.readConfig('background-color'));
             }
         });

         $('#tabs').find('.mobFeedRefresh').click();

     });

    </script>

    <body>

        <div id="tabs">
            <ul id="theTabs"></ul>
        </div>

        <div id="tabDialog" title="Rename tab">
            <form>
                <fieldset>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="tabName" value="Jane Smith" class="text ui-widget-content ui-corner-all">
                    <!-- Allow form submission with keyboard without duplicating the dialog button -->
                    <input type="submit" tabindex="-1" style="position:absolute; top:-1000px">
                </fieldset>
            </form>
        </div>
        <div id="slider" class="mobylette">

            <h1>
                <i class="fa fa-motorcycle fa-5x" aria-hidden="true"></i>
                <span>Mobylette</span>
            </h1>

            <fieldset id="prefsForm">
                <button id="saveTabs"><i class="fa fa-save" aria-hidden="true"></i> Save Tabs</button>

                <label for="tabDropActivate">Open tab on feed drop</label>
                <input type="checkbox" name="tabDropActivate" id="tabDropActivate">
                <button id="colorselector2"><i class="fa fa-cube" aria-hidden="true"></i> Color</button>

                <select id="themes">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <option value="base">Base</option>
                    <option value="black-tie">Black-Tie</option>
                    <option value="blitzer">Blitzer</option>
                    <option value="cupertino">Cupertino</option>
                    <option value="dark-hive">Dark-hive</option>
                    <option value="dot-luv">Dot-luv</option>
                    <option value="eggplant">Eggplant</option>
                    <option value="excite-bike">Excite-bike</option>
                    <option value="flick">Flick</option>
                    <option value="hot-sneaks">Hot-sneaks</option>
                    <option value="humanity">Humanity</option>
                    <option value="le-frog">Le-frog</option>
                    <option value="mint-choc">Mint-choc</option>
                    <option value="overcast">Overcast</option>
                    <option value="pepper-grinder">Pepper-grinder</option>
                    <option value="redmond">Redmond</option>
                    <option value="smoothness">Smoothness</option>
                    <option value="south-street">South-street</option>
                    <option value="start">Start</option>
                    <option value="sunny">Sunny</option>
                    <option value="swanky-purse">Swanky-purse</option>
                    <option value="trontastic">Trontastic</option>
                    <option value="ui-darkness">Ui-darkness</option>
                    <option value="ui-lightness">Ui-lightness</option>
                    <option value="vader">Vader</option>
                </select>
            </fieldset>

        </div>
        <button id="addTab" class="mobylette"><i class="fa fa-plus" aria-hidden="true"></i> Add Tab</button>
        <button id="trigger" class="mobylette"><i class="fa fa-cogs" aria-hidden="true"></i> Preferences</button>
    </body>
    <script src="/static/lib/js/tab.js"></script>
    <script src="/static/lib/js/feed.js"></script>
    <script src="/static/lib/js/prefs.js"></script>
</html>
