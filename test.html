<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NWS reboot</title>
        <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" />
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">

        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        
    </head>

    <style>
     
     .connectedSortable li {
         cursor:grab;
         margin: 0 5px 5px 5px;
         padding: 5px;
         font-size: 1.2em;
         width: 120px;
     }
     .chbox {
         margin-right:10px;
     }
     .selected {
         background:red !important;
     }
     .hidden {
         display:none;
     }

     .ui-tabs-panel {
         padding:.4em .1em !important;
     }
     
    </style>
    
    <script>
     
     $(document).bind('DOMNodeInserted', function(e) {
         var element = e.target;

         // console.log('NEW: ' + $(element).attr('class'));

         // $("#tabs").tabs('refresh');
         

         if ($(element).attr('class') == 'tab') {
             console.log('TAB!');
         }
         
     });
     
     var tabList =
         [{"name":"plop",
           "feeds":[
               {"url":"//url9","type":"photo","limit":16},
               {"url":"//url1","type":"photo","limit":16},
               {"url":"//url3","type":"text","limit":16}
           ]},
          {"name":"plip",
           "feeds": [
               {"url":"//url5","type":"text","limit": 12},
               {"url":"//url4","type":"mixed","limit": 8}
           ]}
         ];

     $(document).ready(function() {
         

         function newFeed(tab, url, type, limit) {

             $('#' + tab + ' ul').append('<li class="ui-state-default"><input class="chbox" type="checkbox" />' + url + '</li>');
         }
         
         function newTab(name, feeds) {

             var tabIndex = $('#tabs ul').length;

             // var $allTabs = $('#tabs');
             
             var $thisTab = $('<div class="tab" id="tab-' + tabIndex + '"><ul id="sortable' + tabIndex + '" class="connectedSortable ui-helper-reset"></ul><button class="addFeed">Add Feed</button></div>').appendTo('#tabs');

             var $allTabs = $thisTab.parent('#tabs');

             $('#tabs ul#theTabs').append('<li><a href="#tab-' + tabIndex  + '">' + name + '</a></li>');

             if(typeof feeds != 'undefined') {
                 feeds.forEach(function(feed) {
                     newFeed('tab-' + tabIndex, feed.url, feed.type, feed.limit);
                 });
             }
             
             $("#tabs").tabs('refresh');

             // $allTabs.tabs().tabs("refresh");
             // $("#tabs").tabs('refresh');
             $( "#tabs" ).tabs( "option", "active", tabIndex - 1 );
             tabIndex++;
         }
         
         var $tabs = $("#tabs").tabs();

         tabList.forEach(function(tab) {
             newTab(tab.name, tab.feeds);
         });

         $('.connectedSortable').on('click', 'input', function () {
             $(this).parent().toggleClass('selected');
         });

         $('#addTab').click(function () {
             newTab('plup');
         });


         $(".connectedSortable").sortable({
             revert:0,
             helper: function (e, item) { //create custom helper
                 if (!item.hasClass('selected')) item.addClass('selected');
                 // clone selected items before hiding
                 var elements = $('.selected').not('.ui-sortable-placeholder').clone();
                 //hide selected items
                 item.siblings('.selected').addClass('hidden');
                 var helper = $('<ul/>');
                 return helper.append(elements);
             },
             start: function (e, ui) {
                 var elements = ui.item.siblings('.selected.hidden').not('.ui-sortable-placeholder');
                 //store the selected items to item being dragged
                 ui.item.data('items', elements);
             },
             update: function (e, ui) {
                 //manually add the selected items before the one actually being dragged
                 ui.item.before(ui.item.data('items'));
             },
             stop: function (e, ui) {
                 //show the selected items after the operation
                 ui.item.siblings('.selected').removeClass('hidden');
                 //unselect since the operation is complete
                 $('.selected').removeClass('selected');
                 $(this).find('input:checked').prop('checked',false);
             }

         }).disableSelection();
         
         var $tab_items = $("ul:first li", $tabs).droppable({
             accept: "ul, .connectedSortable li",
             hoverClass: "ui-state-hover",
             drop: function (event, ui) {
                 var $item = $(this);
                 var $elements = ui.draggable.data('items');
                 var $list = $($item.find("a").attr("href"))
                     .find(".connectedSortable");
                 $elements.show().hide('slow');
                 ui.draggable.show().hide("slow", function () {
                     $tabs.tabs("option", "active", $tab_items.index($item));
                     $(this).appendTo($list).show("slow").before($elements.show("slow"));
                     
                 });
             }
         });

     });
     
    </script>
    
    <body>

        <div id="tabs">
            <ul id="theTabs"></ul>
        </div>
        <button id="addTab">Add Tab</button>
        
    </body>
</html>
