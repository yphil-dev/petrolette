<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NWS reboot</title>
        <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" />
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    </head>

    <style>

     ul {
         list-style-type: none;
         margin:0;
         padding:0;
     }

     .tabSort li {
         cursor:grab;
         margin: 0 5px 5px 5px;
         padding: 5px;
         font-size: 1.2em;
         width: 120px;
     }

     .chbox {
         margin-right:10px;
     }

     .selected {
         background:red !important;
     }

     .hidden {
         display:none;
     }

     .ui-tabs-panel {
         padding:.4em .1em !important;
     }

     label, input { display:block; }
     input.text { margin-bottom:12px; width:95%; padding: .4em; }
     fieldset { padding:0; border:0; margin-top:25px; }

    </style>

    <script>

     var tabList =
         [{"name":"plop",
           "feeds":[
               {"url":"//url9","type":"photo","limit":16},
               {"url":"//url1","type":"photo","limit":16},
               {"url":"//url3","type":"text","limit":16}
           ]},
          {"name":"plip",
           "feeds": [
               {"url":"//url5","type":"text","limit": 12},
               {"url":"//url4","type":"mixed","limit": 8}
           ]},
          {"name":"plup",
           "feeds": [
               {"url":"//url50","type":"text","limit": 12},
               {"url":"//url14","type":"mixed","limit": 8}
           ]}
         ];

     $(document).ready(function() {

         function newFeed($tab, url, type, limit) {

             var $chbox = $('<input class="chbox" type="checkbox" />');

             var $li = $('<li class="ui-state-default" data-url="' + url + '" data-type="' + type + '" data-limit="' + limit + '">' + url + '</li>')

             $chbox.appendTo($li);
             $li.appendTo($tab);
         }

         function newTab(name, feeds) {

             var tabIndex = $('#tabs ul').length;

             if (!name) {
                 var name = 'Tab ' + tabIndex;
             }

             var $thisSortable = $('<ul id="sortable' + tabIndex + '" class="tabSort"></ul>');

             var $thisButton = $('<button class="addFeed">Add Feed</button>');

             $thisButton.on( "click", function() {
                 newFeed($(this).prev(), '//url100', 'photo', 8);
             });

             var $thisTabPane = $('<div class="tab" id="tab-' + tabIndex + '"></div>');

             $thisSortable.on('click', 'input', function () {
                 $(this).parent().toggleClass('selected');
             });

             $thisSortable.sortable({
                 revert:0,
                 helper: function (e, item) { //create custom helper
                     if (!item.hasClass('selected')) item.addClass('selected');
                     // clone selected items before hiding
                     var $elements = $('.selected').not('.ui-sortable-placeholder').clone();
                     //hide selected items
                     item.siblings('.selected').addClass('hidden');
                     var helper = $('<ul/>');
                     return helper.append($elements);
                 },
                 start: function (e, ui) {
                     var $elements = ui.item.siblings('.selected.hidden').not('.ui-sortable-placeholder');
                     //store the selected items to item being dragged
                     ui.item.data('items', $elements);
                 },
                 update: function (e, ui) {
                     //manually add the selected items before the one actually being dragged
                     ui.item.before(ui.item.data('items'));
                 },
                 stop: function (e, ui) {
                     //show the selected items after the operation
                     ui.item.siblings('.selected').removeClass('hidden');
                     //unselect since the operation is complete
                     $('.selected').removeClass('selected');
                     $(this).find('input:checked').prop('checked',false);
                 }
             }).disableSelection();

             $thisSortable.appendTo($thisTabPane);
             $thisButton.appendTo($thisTabPane);
             $thisTabPane.appendTo($tabs);

             var $thisTabLink = $('<a href="#tab-' + tabIndex  + '">' + name + '</a>')

             var $thisTab = $('<li class="modal"></li>');

             $thisTabLink.appendTo($thisTab);

             var $thisSelectedTab = $("#tabs div.ui-tabs-panel:not(.ui-tabs-hide)");

             $thisTab.droppable({
                 accept: "ul, .tabSort li",
                 hoverClass: "ui-state-hover",
                 drop: function (event, ui) {
                     var $item = $(this);
                     var $index = $( "li" ).index( this );
                     console.log('elt: ' + $index);
                     var $elements = ui.draggable.data('items');
                     var $list = $($item.find("a").attr("href"))
                         .find(".tabSort");
                     $elements.show().hide('slow');
                     ui.draggable.show().hide("slow", function () {

                         if ($('#tabDropActivate').prop('checked')) {
                             $tabs.tabs("option", "active", $index);
                         }

                         $(this).appendTo($list).show("slow").before($elements.show("slow"));
                     });
                 }
             }).appendTo('#tabs ul#theTabs');

             if(typeof feeds != 'undefined') {
                 feeds.forEach(function(feed) {
                     newFeed($('#tab-' + tabIndex + ' ul'), feed.url, feed.type, feed.limit);
                 });
             };

             $tabs.tabs('refresh');
             $tabs.tabs( "option", "active", tabIndex - 1);
             tabIndex++;
         }

         var $tabs = $("#tabs").tabs({
             heightStyle: "fill"
         });

         tabList.forEach(function(tab) {
             newTab(tab.name, tab.feeds);
         });

         $('#addTab').click(function () {
             newTab();
         });

         $('#saveTabs').click(function () {
             var myTabs = [];

             $( '#theTabs li' ).each(function(i) {
                 var myFeeds = [];
                 var myTab = {};

                 myTab["name"] = $(this).children().text();

                 // myTabs
                 $($(this).children().attr('href') + ' ul li').each(function(i) {
                     var myFeed = {};
                     myFeed["url"] = $(this).data('url');
                     myFeed["type"] = $(this).data('type');
                     myFeed["limit"] = $(this).data('limit');
                     myFeeds.push(myFeed);
                 });
                 myTab["feeds"] = myFeeds;
                 myTabs.push(myTab)
             });
             console.log(JSON.stringify(myTabs));
         });

         $tabs.find( ".ui-tabs-nav" ).sortable({
             axis: "x",
             stop: function() {
                 $tabs.tabs( "refresh" );
             }
         });

         $( "#opener" ).on( "click", function() {
             $( "#tabDialog" ).dialog( "open" );
         });

         var spinner = $('#tabLimit').spinner();

         $( ".radio" ).checkboxradio();

         $( '#tabDialog' ).dialog({
             autoOpen: false,
             resizable: false,
             height: 'auto',
             width: 400,
             modal: true,
             buttons: {
                 'Tab name': function() {
                     $( this ).dialog( 'close' );
                 },
                 Cancel: function() {
                     $( this ).dialog( 'close' );
                 }
             },
             open: function( event, ui ) {
                 console.log('plop! ' + $(this).data('tabName'));
                 $('#tabName').val($(this).data('tabName'));
             }
         });

         $('#tabs').on('mouseup', '.ui-tabs-active', function(e){
             console.log('plop! ' + $(this).text());
             e.preventDefault();
             $( '#tabDialog' )
                 .data('tabName', $(this).text())
                 .dialog('open');
         });

     });

    </script>

    <body>

        <div id="tabs">
            <ul id="theTabs"></ul>
        </div>
        <button id="addTab">Add Tab</button>
        <button id="saveTabs">Save Tabs</button>
        Activate tab on feed drop <input id="tabDropActivate" type="checkbox" value="">

        <div class="wrapper">
            <p>This example is designed to demonstrate usage of the <a href="http://dev.w3.org/html5/webstorage/">W3C Web Storage API</a>.</p>

            <form>
                <div>
                    <label for="bgcolor">Choose background color:</label>
                    <input class="color" id="bgcolor" value="FF0000">
                </div>
                <div>
                    <label for="font">Choose font style:</label>
                    <select id="font">
                        <option value="'Open Sans Condensed', sans-serif" selected>Sans-serif</option>
                        <option value="'Bitter', serif">Serif</option>
                        <option value="'Ubuntu Mono'">Monospace</option>
                    </select>
                </div>
            </form>

            <footer></footer>
        </div>

        <div id="tabDialog" title="Rename tab">
            <form>
                <fieldset>
                    <label for="name">Name</label>
                    <input type="text" name="name" id="tabName" value="Jane Smith" class="text ui-widget-content ui-corner-all">
                    <label for="email">Type</label>

                    <label for="radio-1">New York</label>
                    <input class="radio" type="radio" name="radio-1" id="radio-1">
                    <label for="radio-2">Paris</label>
                    <input class="radio" type="radio" name="radio-1" id="radio-2">
                    <label for="radio-3">London</label>
                    <input class="radio" type="radio" name="radio-1" id="radio-3">

                    <label for="password">Limit</label>
                    <input id="tabLimit" name="spinner" value="8">

                    <!-- Allow form submission with keyboard without duplicating the dialog button -->
                    <input type="submit" tabindex="-1" style="position:absolute; top:-1000px">
                </fieldset>
            </form>
        </div>

        <button id="opener">Open Dialog</button>

    </body>
    <script src="lib/js/jscolor/jscolor.js"></script>
    <script src="lib/js/prefs.js"></script>
</html>
