<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>NWS reboot</title>
        <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" />
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
        <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
        <script>

         function loadFileJSON( toLocalStorage, fromUrl){
             if (localStorage[toLocalStorage])
                 { console.log("Good! Data already loaded locally! Nothing to do!");  }
             else {
                 $.getJSON(   fromUrl   , function(data) { 
                     localStorage[toLocalStorage] = JSON.stringify(data);
                     console.log("Damn! Data not yet loaded locally! Ok: I'am loading it!");
                 });
             }
         }
         
         // Function's firing:
         loadFileJSON( 'myData','data.json');

         var myJSON = JSON.parse(localStorage.myData);
         //Read:
         alert("Mister " + myJSON[1].myKey + ", your current score is "+ myJSON[1].score +"!");
         
         function newTab () {
             var tabIndex = $('#tabs ul').length;
             
             $('#tabs ul').append('<li><a href="#tab-' + tabIndex  + '">Tab ' + tabIndex + '</a></li>');
             
             $('#tabs').append('<div id="tab-' + tabIndex + '"><p> I am tab number ' + tabIndex + '</p></div>');

             $( "#tabs" ).tabs();

         }

         $( function() {
             newTab();
             // newTab();
         });


         
         
        </script>
    </head>
    <body>
        
        <div id="tabs">
            <ul>
             
            </ul>
        </div>
        
        
    </body>
</html>
