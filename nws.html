<!DOCTYPE html>
<html lang="en">
    <head>
        <title>NWS - Rebooted</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="robots" content="noindex,nofollow">
        <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico" />
        <link id="jquery-ui-css" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css" />
        
        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />

        <style type="text/css" media="screen">@import "libs/nws-style.css";</style>
    </head>
    <body>
        
        <script
            src="https://code.jquery.com/jquery-3.2.1.min.js"
            integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
            crossorigin="anonymous"></script>
        
        <script
            src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"
            integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU="
            crossorigin="anonymous"></script>

        <script src="ls.js"></script>

        <script>

         $(document).ready(function() {

             var tabTitle = $('#tab_title'),
                 tabContent = $('#tab_content'),
                 tabTemplate = '<li><a href="#{href}">#{label}</a> <span class="ui-icon ui-icon-close" role="presentation">Remove Tab</span></li>',
                 tabCounter = $('#tabs').children('div').length + 1,
                 feedTemplate = '';
             
             var tabs = $('#tabs').tabs();
             var feeds = $('#tabs').children('div');
             
             // Modal dialog init: custom buttons and a "close" callback resetting the form inside
             var dialog = $( "#dialog" ).dialog({
                 autoOpen: false,
                 modal: true,
                 buttons: {
                     Add: function() {
                         addTab();
                         $( this ).dialog( "close" );
                     },
                     Cancel: function() {
                         $( this ).dialog( "close" );
                     }
                 },
                 close: function() {
                     form[ 0 ].reset();
                 }
             });
             
             // AddTab form: calls addTab function on submit and closes the dialog
             var form = dialog.find( "form" ).on( "submit", function( event ) {
                 addTab();
                 dialog.dialog( "close" );
                 event.preventDefault();
             });
             
             // Actual addTab function: adds new tab using the input from the form above
             function addTab() {
                 var label = tabTitle.val() || "Tab " + tabCounter++,
                     id = "tabs-" + tabCounter,
                     li = $( tabTemplate.replace( /#\{href\}/g, "#" + id ).replace( /#\{label\}/g, label ) ),
                     tabContentHtml = tabContent.val() || "Plop Tab " + tabCounter + " contentz.";
                 
                 tabs.find( ".ui-tabs-nav" ).append( li );
                 tabs.append( '<div class="elements grid nws-tab-feeds nws-tab-feeds-col ui-tabs-panel ui-corner-bottom ui-widget-content" id="' + id + '"><div class="element grid-item outerContainer-col outerContainer">' + tabContentHtml + '</div></div>' );

                 
                 
                 tabs.tabs( "refresh" );
                 tabCounter++;
             }
             
             // AddTab button: just opens the dialog
             $( "#add_tab" )
                 .button()
                 .on( "click", function() {
                     dialog.dialog( "open" );
                 });
             
             // Close icon: removing the tab on click
             tabs.on( "click", "span.ui-icon-close", function() {
                 var panelId = $( this ).closest( "li" ).remove().attr( "aria-controls" );
                 $( "#" + panelId ).remove();
                 tabs.tabs( "refresh" );
             });

             // Close icon: removing the feed on click
             feeds.on( "click", "span.ui-icon-close", function() {
                 $(this).remove();
             });
             
             tabs.on( "keyup", function( event ) {
                 if ( event.altKey && event.keyCode === $.ui.keyCode.BACKSPACE ) {
                     var panelId = tabs.find( ".ui-tabs-active" ).remove().attr( "aria-controls" );
                     $( "#" + panelId ).remove();
                     tabs.tabs( "refresh" );
                 }
             });

             $('.elements').children().draggable({
                 appendTo: 'body',
                 opacity: 0.9,
                 helper: "clone",
                 zIndex: 1000,
                 cursorAt: {
                     left: 50,
                     top: 20
                 },
             });

             // drop into needle element
             $('.elements').droppable({
                 accept: '.element',
                 tolerance: 'pointer',
                 activeClass: "can-drop",
                 hoverClass: "drop-here",
                 drop: function(event, ui) {
                     $(this).append(ui.draggable[0]);
                     // var count = $("#tabs-1 div").length;
                     console.log('l: ' + $(this).children().length);
                 }
             });

             // drop
             $('.ui-tabs-nav').children().droppable({
                 accept: '.element',
                 tolerance: 'pointer',
                 over: function(event, ui) {
                     $("#tabs").tabs("option", "active", $(event.target).index());

                     $.ui.ddmanager.prepareOffsets(ui.draggable.draggable('instance'));
                 }
             })

             
         });
         
        </script>

        <div id="dialog" title="Tab data">
            <form>
                <fieldset class="ui-helper-reset">
                    <label for="tab_title">Title</label>
                    <input type="text" name="tab_title" id="tab_title" value="Tab Title" class="ui-widget-content ui-corner-all">
                    <label for="tab_content">Content</label>
                    <textarea name="tab_content" id="tab_content" class="ui-widget-content ui-corner-all">Tab content</textarea>
                </fieldset>
            </form>
        </div>

        <div id="tabs">
            <ul>
                <li><a href="#tabs-1">plip</a> <span class="ui-icon ui-icon-close" role="presentation">Remove Tab</span></li>
                <li><a href="#tabs-2">plop</a> <span class="ui-icon ui-icon-close" role="presentation">Remove Tab</span></li>
            </ul>
            <div id="tabs-1">
                <div class="elements grid nws-tab-feeds nws-tab-feeds-col ui-tabs-panel ui-corner-bottom ui-widget-content">
                    <div data-index="" class="element grid-item outerContainer-col outerContainer">Element 1:plip</div>
                    <div data-index="" class="element grid-item outerContainer-col outerContainer">Element 2:plop</div>
                    <div data-index="" class="element grid-item outerContainer-col outerContainer">Element 3:zob</div>
                </div>
            </div>
            <div id="tabs-2">
                <div class="elements grid nws-tab-feeds nws-tab-feeds-col ui-tabs-panel ui-corner-bottom ui-widget-content">
                    <div data-index="" class="element grid-item outerContainer-col outerContainer">Element 11:foo</div>
                    <div data-index="" class="element grid-item outerContainer-col outerContainer">Element 12:bar</div>
                </div>
            </div>
        </div>
        <button id="add_tab">Add Tab</button>
        
    </body>
</html>
