image: node:18-alpine

stages:
  - build
  - deploy

variables:
  FLY_API_TOKEN: "<your-fly-api-token>" # Add this variable in GitLab CI/CD settings securely.

build-job:
  stage: build
  script:
    - npm ci
  artifacts:
    paths:
      - .

deploy-job:
  stage: deploy
  script:
    - curl -L https://fly.io/install.sh | sh
    - export FLYCTL_INSTALL="$HOME/.fly"
    - export PATH="$FLYCTL_INSTALL/bin:$PATH"
    - flyctl auth token "$FLY_API_TOKEN"
    - flyctl deploy --remote-only
  only:
    - main
