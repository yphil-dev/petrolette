<div class="handle ui-corner-right" title="Preferences">
  <i class="icon-right-open rotate"></i>
</div>

<div id="logo">
  <i class="mobylette logoItem icon-motorcycle" aria-hidden="true"></i>
  <h1 class="logoItem">Mobylette</h1>
</div>

<form>
  <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
    <legend id="languageLegend"
            class="ui-corner-top translate"
            data-content="Language">
      Language
    </legend>

    <select id="language"
            name="language"
            class="unique">

      <option id="optionEnglish"
              class="translate"
              data-content="English"
              selected="selected"
              value="en">
        English
      </option>
      <option id="optionFrench"
              class="translate"
              data-content="French"
              value="fr">
        French
      </option>
      <option id="optionJapanese"
              class="translate"
              data-content="Japanese"
              value="ja">
        Japanese
      </option>
      <option id="optionSpanish"
              class="translate"
              data-content="Spanish"
              value="es">
        Espagnol
      </option>
    </select>

  </fieldset>

  <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
    <legend id="tabsLegend"
            class="ui-corner-top translate"
            data-content="Tabs">Tabs</legend>

    <input id="fileImport"
           type="file"
           style="display: none;" />
    <button id="fileImport"
            class="twin left button icon-upload translate"
            data-title="Open feeds and tabs file"
            data-content="Load">
      Load
    </button>
    <button id="saveTabs"
            class="twin right icon-download translate"
            data-title="Save feeds and tabs file"
            data-content="Save">
      Save
    </button>

    <input class="checkboxradio ui-helper-hidden" type="checkbox" name="tabDropActivate" id="tabDropActivate">
    <label id="dropTabLabel"
           class="unique noBottom translate"
           for="tabDropActivate"
           data-title="Open tab on feed drop"
           data-content="Open tab on feed drop">
      Open tab on feed drop
    </label>
  </fieldset>

  <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
    <legend id="themeLegend"
            class="ui-corner-top translate"
            data-content="Theme">
      Theme
    </legend>

    <label id="dayLabel"
           class="twin left noBottom translate"
           for="day"
           data-title="Day theme"
           data-content="Day">
      Day
    </label>
    <input id="day"
           class="themeSwitcher checkboxradio"
           type="radio"
           name="radio-1"
           value="day">

    <label id="nightLabel"
           class="twin right noBottom translate"
           for="night"
           data-title="Night theme"
           data-content="Night">
      Night
    </label>

    <input id="night"
           class="themeSwitcher checkboxradio noBottom"
           type="radio"
           name="radio-1"
           value="night">
  </fieldset>

  <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
    <legend id="imageGalleryLegend"
            class="ui-corner-top translate"
            data-content="Image gallery">
      Image gallery
    </legend>
    <label class="twin grow" for="gallerySlideshowSpeedValue">
      <span
        id="gallerySlideshowSpeedLabel"
        class="twin translate"
        data-content="Slideshow speed">
        Slideshow speed
      </span>
      <span id="gallerySlideshowSpeedValue" class="twin"></span>
    </label>
    <div class="unique" id="gallerySlideshowSpeed"></div>

    <label id="gallerySlideTransitionLabel"
           class="unique translate"
           for="gallerySlideTransition"
           data-content="Slide transition">
      Slide transition
    </label>

    <select class="unique" id="gallerySlideTransition">
      <option class="translate"
              data-content="None"
              value="false">None</option>
      <option class="translate"
              data-content="Fade"
              value="fade">Fade</option>
      <option class="translate"
              data-content="Slide"
              value="slide">Slide</option>
      <option class="translate"
              data-content="Circular"
              value="circular">Circular</option>
      <option class="translate"
              data-content="Tube"
              value="tube">Tube</option>
      <option class="translate"
              data-content="Zoom"
              value="zoom-in-out">Zoom-in-out</option>
      <option class="translate"
              data-content="Rotate"
              value="rotate">Rotate</option>
    </select>

  </fieldset>

  <fieldset class="menuForm ui-widget ui-widget-content ui-corner-all">
    <legend id="helpLegend"
            data-content="Help"
            class="ui-corner-top translate">
      Help
    </legend>
    <button id="profile"
            class="unique icon-police translate"
            data-content="Profile"
            data-title="Forgot what you are? Reset Mobylette tabs & feeds">
      Profil
    </button>
    <button id="donate"
            class="unique icon-heartbeat noBottom translate"
            data-title="Mobylette (really) needs your help"
            data-content="Donate">
      Donate
    </button>
    </fieldset>

    <fieldset id="mobNotify" class="ui-widget ui-widget-content ui-corner-all">
        <legend class="ui-corner-top">Notifications</legend>
        <p></p>
    </fieldset>
</form>
